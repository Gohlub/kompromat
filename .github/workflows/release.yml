name: Release CLI

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
      RELEASE_TAG: ${{ github.ref_name }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Check release version
        run: |
          version="$(cargo metadata --format-version 1 --no-deps | python3 -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            printf 'Tag %s does not match Cargo version %s\n' "$RELEASE_TAG" "$version" >&2
            exit 1
          fi
      - name: Install musl compiler
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
      - name: Build CLI
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            export TARGET_CC=musl-gcc
            export RUSTFLAGS="-C linker=musl-gcc"
          fi
          cargo build --locked --release --bin kompromat --target "$TARGET"
          "target/$TARGET/release/kompromat" --version
      - name: Package CLI
        run: |
          mkdir -p dist package
          cp "target/$TARGET/release/kompromat" package/kompromat
          cp LICENSE package/LICENSE
          tar -czf "dist/kompromat-$TARGET.tar.gz" -C package kompromat LICENSE
          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          for archive in Path("dist").glob("*.tar.gz"):
              digest = hashlib.sha256(archive.read_bytes()).hexdigest()
              archive.with_suffix(archive.suffix + ".sha256").write_text(f"{digest}  {archive.name}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kompromat-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    # TODO: Require CI checks to pass for the tagged commit before publishing.
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$RELEASE_TAG" --generate-notes "${flags[@]}"
