[package]
name = "kompromat"
version = "0.1.0"
edition = "2024"
description = "Encrypted dossiers, proofs of key possession, and private replies."
license = "MIT"
default-run = "kompromat"

[dependencies]
anyhow = "1"
axum = "0.8"
chacha20poly1305 = "0.10.1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
hkdf = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
rusqlite = { version = "0.37", features = ["bundled"] }
schnorrkel = { version = "0.11.5", features = ["aead"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
